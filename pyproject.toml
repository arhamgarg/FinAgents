[build-system]
requires = ["uv_build>=0.5,<1.0"]
build-backend = "uv_build"

[project]
name = "financialagents"
version = "0.1.0"
description = "Multi-agent LLM trading signal framework for Indian equities"
requires-python = ">=3.12,<3.14"

dependencies = [
    "langgraph==1.1.6",
    "langchain==1.2.15",
    "langchain-groq==1.1.2",
    "langchain-openai==1.2.1",
    "langchain-cerebras==0.8.2",
    "langchain-core>=0.3",
    "pydantic-settings==2.13.1",
    "python-dotenv>=1.0",
    "smartapi-python==1.5.5",
    "logzero>=1.7.0",
    "pyotp==2.9.0",
    "httpx==0.28.1",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.3",
    "praw==7.8.1",
    "aiosqlite==0.22.1",
    "aiolimiter==1.2.1",
    "trendspyg==0.4.2",
    "pandas==3.0.2",
    "pandas-ta==0.4.71b0",
    "pyarrow>=16.0",
    "typer==0.24.1",
    "rich==14.3.3",
    "streamlit==1.56.0",
    "platformdirs>=4.9.6",
]

[project.scripts]
financialagents = "financialagents.cli.main:app"
fa = "financialagents.cli.main:app"

[project.optional-dependencies]
dev = [
    "ty>=0.0.29",
    "ruff",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-httpx==0.36.2",
]

[tool.uv.build-backend]
module-name = "financialagents"
module-root = ""

[tool.ty]
[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
